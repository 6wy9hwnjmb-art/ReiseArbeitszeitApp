name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version prüfen
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\ReiseArbeitszeitApp.csproj
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($projectVersion -ne $tagVersion) {
            throw "Projektversion $projectVersion stimmt nicht mit Tag $tagVersion überein."
          }

      - name: Inno Setup herunterladen und prüfen
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $expectedHash = "9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732"
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Die Prüfsumme des Inno-Setup-Installers stimmt nicht."
          }
          $process = Start-Process -FilePath $installer `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup konnte nicht installiert werden. Exitcode: $($process.ExitCode)"
          }

      - name: App und Installer bauen
        shell: pwsh
        run: .\BuildInstaller.ps1

      - name: GitHub Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content .\ReiseArbeitszeitApp.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          gh release create "${{ github.ref_name }}" `
            ".\publish\installer\ReiseArbeitszeitApp-Setup-$version.exe" `
            ".\publish\ReiseArbeitszeitApp-$version-win-x64.zip" `
            ".\publish\win-x64-v$version\ReiseArbeitszeitApp.exe" `
            --title "Reise- und Arbeitszeitrechner $version" `
            --generate-notes

