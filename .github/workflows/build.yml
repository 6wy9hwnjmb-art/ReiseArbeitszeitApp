name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v6

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build .\ReiseArbeitszeitApp.csproj -c Release
